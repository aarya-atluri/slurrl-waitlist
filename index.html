<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>slurrl. Waitlist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-black text-white font-['Instrument_Serif'] flex items-center justify-center min-h-screen antialiased">

  <main class="text-center p-8 max-w-lg mx-auto">
    <h1 class="text-8xl md:text-9xl font-normal">slurrl.</h1>
    <p class="text-2xl md:text-3xl mt-2 text-gray-400">hate reimagined.</p>

    <form id="waitlist-form" class="mt-16 flex flex-col items-center" novalidate>
      <p class="text-lg text-gray-300 mb-4 max-w-xs">
        Sign up to receive the slurrl. white paper and access to the early beta
      </p>
      
      <div class="flex flex-col sm:flex-row items-center justify-center gap-2 w-full max-w-md">
        <input 
          id="email-input" 
          type="email" 
          placeholder="Enter your email" 
          aria-label="Email Address"
          required
          class="flex-grow w-full px-4 py-3 bg-black text-white border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-white placeholder-gray-500 transition-colors duration-200"
        />
        <button 
          id="submit-button"
          type="submit" 
          class="w-full sm:w-auto px-6 py-3 bg-white text-black font-bold rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 transition-colors duration-200 disabled:bg-gray-500 disabled:cursor-not-allowed"
        >
          Join Waitlist
        </button>
      </div>

      <p id="message-element" class="text-md mt-4 h-6" aria-live="polite"></p>
    </form>
  </main>

  <script src="./index.js"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
